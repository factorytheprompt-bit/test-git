name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Localiser le projet Gradle
        id: locate
        run: |
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "MonEpargne/settings.gradle" ] || [ -f "MonEpargne/settings.gradle.kts" ]; then
            echo "dir=MonEpargne" >> "$GITHUB_OUTPUT"
          else
            echo "Impossible de trouver settings.gradle (ni à la racine, ni dans MonEpargne/)." >&2
            find . -maxdepth 3 -name "settings.gradle*" >&2
            exit 1
          fi

      - name: Compiler l'APK debug
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Compiler l'APK release (non signé)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleRelease --no-daemon

      - name: Publier l'APK debug comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: MonEpargne-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK release comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: MonEpargne-release-unsigned-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/app-release-unsigned.apk
