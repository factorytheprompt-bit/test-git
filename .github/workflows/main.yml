name: Build APK

# Se déclenche à chaque push sur main, à chaque pull request,
# et manuellement depuis l'onglet "Actions" de GitHub (bouton "Run workflow").
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Le projet ne contient pas gradlew/gradle-wrapper.jar (fichier binaire).
      # Cette action installe Gradle directement, donc "gradlew" n'est pas requis.
      - name: Installer Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Compiler l'APK debug
        run: gradle assembleDebug --no-daemon

      - name: Compiler l'APK release (non signé)
        run: gradle assembleRelease --no-daemon

      - name: Publier l'APK debug comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: MonEpargne-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK release comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: MonEpargne-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
