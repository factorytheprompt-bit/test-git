name: Construire Mon Epargne APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Décompresser le projet
        run: |
          mkdir project
          unzip -q MonEpargne.zip -d project

      - name: Trouver le projet Android
        run: |
          echo "Recherche de gradlew..."
          find project -name gradlew -type f

      - name: Compiler l'APK
        run: |
          ROOT=$(dirname "$(find project -name gradlew -type f | head -1)")
          echo "Projet trouvé dans : $ROOT"
          chmod +x "$ROOT/gradlew"
          cd "$ROOT"
          ./gradlew assembleDebug

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Epargne-APK
          path: "**/build/outputs/apk/debug/*.apk"
