name: Construire Mon Epargne APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Décompresser MonEpargne
        run: |
          mkdir project
          unzip -q MonEpargne.zip -d project

      - name: Vérifier le projet
        run: |
          echo "Recherche du projet Android..."
          find project -name gradlew -type f
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Configurer Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > project/local.properties

      - name: Compiler l'APK
        run: |
          ROOT=$(dirname "$(find project -name gradlew -type f | head -1)")
          echo "Projet trouvé : $ROOT"
          chmod +x "$ROOT/gradlew"
          cd "$ROOT"
          ./gradlew assembleDebug --stacktrace

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Epargne-APK
          path: "**/build/outputs/apk/debug/*.apk"
