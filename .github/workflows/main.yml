name: Construire Mon Epargne APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Décompresser le projet
        run: |
          rm -rf project
          mkdir project
          unzip -q MonEpargne.zip -d project

      - name: Trouver le dossier Android
        run: |
          echo "Structure du projet :"
          find project -maxdepth 4 -type f | sort

      - name: Installer Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "$PWD/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Configurer Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > project/MonEpargne/local.properties

      - name: Compiler l'APK
        run: |
          cd project/MonEpargne
          gradle assembleDebug --stacktrace

      - name: Vérifier l'APK
        run: |
          find project/MonEpargne -type f -name "*.apk" -print

      - name: Télécharger l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Epargne-APK
          path: project/MonEpargne/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
