name: Construire Mon Epargne APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Décompresser MonEpargne
        run: |
          mkdir project
          unzip -q MonEpargne.zip -d project

      - name: Vérifier le projet
        run: |
          echo "Recherche du projet Android..."
          find project -name gradlew -type f
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Configurer Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > project/local.properties

      - name: Inspecter le projet
        run: |
          echo "CONTENU DU ZIP :"
          find project -maxdepth 5 -type f | sort | head -200

      - name: Compiler l'APK
        run: |
          echo "Recherche de build.gradle..."
          find project -name "build.gradle" -o -name "build.gradle.kts"

          echo "Recherche de settings.gradle..."
          find project -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Epargne-APK
          path: "**/build/outputs/apk/debug/*.apk"
